[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "webview"
version = "2.0.0"
description = "Turn your website into a real Android app. URL in, signed APK/AAB out."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-2.0-or-later"
authors = [{ name = "WebView Contributors" }]
keywords = ["android", "webview", "twa", "pwa", "apk", "aab", "bubblewrap", "kotlin"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "jinja2>=3.1",
    "pillow>=10.3",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "respx>=0.21",
    "ruff>=0.5",
]

[project.scripts]
webview = "webview.cli:app"

[project.urls]
Homepage = "https://github.com/rupok/webview"
Repository = "https://github.com/rupok/webview"
Issues = "https://github.com/rupok/webview/issues"
"Legacy v1 (Eclipse, 2014-2015)" = "https://github.com/rupok/webview/tree/archive/eclipse-android"

[tool.hatch.build.targets.wheel]
packages = ["src/webview"]

[tool.hatch.build.targets.wheel.force-include]
"src/webview/templates" = "webview/templates"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
